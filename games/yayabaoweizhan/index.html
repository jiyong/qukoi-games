<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="description" content="在菜园小路边种下喷壶、仙人掌和辣椒炮，挡住一波波害虫，守护幼苗芽芽。">
  <title>芽芽保卫战</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌱</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="hud">
    <h1 class="logo">芽芽保卫战</h1>
    <dl class="stats">
      <div class="stat stat-gold"><dt>金币</dt><dd id="gold">0</dd></div>
      <div class="stat stat-hp"><dt>芽芽</dt><dd><span id="hp">10</span><small>/10</small></dd></div>
      <div class="stat"><dt>波次</dt><dd><span id="wave">0</span><small>/<span id="waves">0</span></small></dd></div>
    </dl>
    <div class="controls">
      <button id="start" class="btn btn-go" type="button">开战 <span id="countdown"></span></button>
      <button id="speed" class="icon-btn" type="button" aria-label="切换倍速" aria-pressed="false">1×</button>
      <button id="pause" class="icon-btn" type="button" aria-label="暂停">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
      </button>
      <button id="mute" class="icon-btn" type="button" aria-label="静音" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path class="wave" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
  </header>

  <main class="field">
    <div id="stage" class="stage">
      <canvas id="board" aria-label="菜园战场。点击空地建塔，点击防御塔升级或出售，点击虫子或障碍物集火。"></canvas>
      <div id="menu" class="menu" hidden></div>
      <div id="toast" class="toast" aria-live="polite"></div>
    </div>
    <p class="rotate-hint">横屏体验更佳</p>
  </main>

  <section id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
    <div class="card">
      <h2 id="ov-title">芽芽保卫战</h2>
      <div id="ov-body" class="ov-body"></div>
      <div id="ov-actions" class="ov-actions"></div>
    </div>
  </section>

  <script src="data.js"></script>
  <script src="map.js"></script>
  <script src="engine.js"></script>
  <script src="save.js"></script>
  <script src="art.js"></script>
  <script src="scene.js"></script>
  <script src="render.js"></script>
  <script src="audio.js"></script>
  <script src="menu.js"></script>
  <script src="ui.js"></script>
</body>
</html>
