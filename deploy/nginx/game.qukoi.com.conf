# game.qukoi.com 静态站点
# 1. 复制到 /etc/nginx/conf.d/game.qukoi.com.conf
# 2. 把下面 ssl_certificate / ssl_certificate_key 改成实际证书路径
# 3. 站点文件放在 /var/www/game.qukoi.com（可用 deploy/deploy.sh 同步）
# 4. nginx -t && nginx -s reload

server {
    listen 80;
    listen [::]:80;
    server_name game.qukoi.com;

    location /.well-known/acme-challenge/ {
        root /var/www/game.qukoi.com;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # nginx >= 1.25.1 可改为 "listen 443 ssl;" + "http2 on;" 以消除弃用警告
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name game.qukoi.com;

    ssl_certificate     /etc/nginx/ssl/game.qukoi.com.pem;
    ssl_certificate_key /etc/nginx/ssl/game.qukoi.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /var/www/game.qukoi.com;
    index index.html;
    charset utf-8;

    access_log /var/log/nginx/game.qukoi.com.access.log;
    error_log  /var/log/nginx/game.qukoi.com.error.log warn;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Never serve repo/dev files
    location ~ /\. { deny all; }
    location ~ ^/(tools|deploy)/ { deny all; }
    location ~* \.(md|sh)$ { deny all; }

    # No add_header inside locations, so the server-level security headers are inherited.
    # "expires epoch" => Cache-Control: no-cache (revalidate each load, file names aren't hashed)
    location ~* \.(html|js|css|json)$ {
        expires epoch;
    }

    location ~* \.(jpg|jpeg|png|webp|gif|svg|ico|mp3|ogg|wav|woff2?)$ {
        expires 7d;
        access_log off;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
